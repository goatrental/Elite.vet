# Odoo 18 pro Elite Vet.
# Slozka ./modules je namountovana jako addons, takze kazdy modul v ni
# je pro Odoo rovnou k dispozici. Novy modul = nova podslozka v ./modules.

services:
  odoo:
    image: odoo:18
    container_name: elitevet-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./modules:/mnt/extra-addons
      - ./config:/etc/odoo
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: elitevet-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
  db-data:
