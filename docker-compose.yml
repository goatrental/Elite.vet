# Odoo 18 pro moduly z tohoto repozitare.
#
# Cely repozitar je namountovany do /mnt/modules. Moduly jsou v nem po
# projektech: elite.vet/ jsou moduly kliniky Elite Vet. Dalsi projekt = dalsi
# slozka vedle a jeden radek navic v addons_path v config/odoo.conf.

services:
  odoo:
    image: odoo:18
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./:/mnt/modules:ro
      - ./config:/etc/odoo:ro
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
  db-data:
